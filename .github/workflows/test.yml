name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with: { r-version: "release" }
      - name: Install dependencies
        run: Rscript -e 'install.packages(c("RSQLite", "jsonlite", "testthat", "DBI"), repos = "https://cloud.r-project.org")'
      - name: Run tests
        run: Rscript tests/testthat.R
