name: Update CRAN Downloads

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cran-downloads-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Install dependencies
        run: Rscript -e 'install.packages(c("RSQLite", "jsonlite", "testthat", "DBI"), repos = "https://cloud.r-project.org")'

      - name: Run unit tests
        run: Rscript tests/testthat.R

      - name: Run update script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out
          Rscript scripts/update.R out/

      - name: Publish changed shards to "current" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if ! gh release view current >/dev/null 2>&1; then
            git tag -f current
            git push -f origin current || true
            gh release create current \
              --title "CRAN Downloads (rolling)" \
              --notes "Latest shards. See manifest.json for what changed in the most recent run." \
              --latest
          fi

          CHANGED=$(jq -r '.changed_shards[]' out/manifest.json)
          for asset in $CHANGED manifest.json; do
            if [ -f "out/$asset" ]; then
              echo "Uploading $asset..."
              gh release upload current "out/$asset" --clobber
            else
              echo "WARNING: $asset listed in manifest but not present on disk"
            fi
          done

      - name: Update last run timestamp
        continue-on-error: true
        run: |
          echo "Last updated: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" > last-updated.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last-updated.txt
          git diff --cached --quiet || git commit -m "chore: update last run time"
          git pull --rebase || true
          git push
